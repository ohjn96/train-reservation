<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>라이선스 현황</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main class="wrap">

  <div class="page-head">
    <h1>라이선스 현황</h1>
    <button id="refresh" class="btn" type="button" style="margin:0">새로고침</button>
  </div>

  <div id="policy" class="statusline"><span class="mark"></span><span>정책 확인 중</span></div>
  <div id="tally" class="tally">집계 중</div>

  <table id="roster" hidden>
    <thead>
      <tr>
        <th scope="col">상태</th>
        <th scope="col">머신 ID</th>
        <th scope="col">대상</th>
        <th scope="col">유효기간</th>
        <th scope="col">만료</th>
        <th scope="col" class="r">남음</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="rosterEmpty"><div class="none"><p>불러오는 중</p></div></div>

  <p class="foot">
    <span id="autoNote"></span><br>
    공개 저장소의 파일을 읽어 그림. <b>누구나 볼 수 있는 페이지.</b><br>
    발급·연장·철회는 요청함에서 <code>/approve 30</code> 같은 댓글로.<br>
    <span class="stamp">확인 <span id="updated">—</span></span>
  </p>

</main>

<script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
