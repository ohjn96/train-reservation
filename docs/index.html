<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>라이선스 현황</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main class="wrap">

  <div class="page-head">
    <h1>라이선스 현황</h1>
    <button id="refresh" class="btn" type="button" style="margin:0">새로고침</button>
  </div>

  <div id="policy" class="statusline"><span class="mark"></span><span>정책 확인 중</span></div>

  <section id="requests" hidden></section>
  <div id="tally" class="tally">집계 중</div>

  <table id="roster" hidden>
    <thead>
      <tr>
        <th scope="col">상태</th>
        <th scope="col">머신 ID</th>
        <th scope="col">대상</th>
        <th scope="col">유효기간</th>
        <th scope="col">만료</th>
        <th scope="col" class="r">남음</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="rosterEmpty"><div class="none"><p>불러오는 중</p></div></div>

  <p class="foot">
    <span id="autoNote"></span><br>
    읽기 전용 화면. 조작 기능 없음 — 발급·연장·철회는 GitHub 에서, 주인만.<br>
    공개 저장소의 파일을 읽어 그리므로 <b>주소를 아는 사람은 볼 수 있음</b>
    (내용은 그 파일에 이미 공개돼 있는 것).<br>
    <span class="stamp">확인 <span id="updated">—</span></span>
  </p>

</main>

<script type="module" src="assets/js/dashboard.js?v=ed14db29"></script>
</body>
</html>
